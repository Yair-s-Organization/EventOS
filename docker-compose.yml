services:
  postgres:
    image: postgres:18
    container_name: eventos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventos
    ports:
      - '5433:5432' # 5433 para no chocar con un PostgreSQL local en 5432
    volumes:
      - pg_data:/var/lib/postgresql
      - ./apps/backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # MinIO dejó de publicar imágenes en Docker Hub/quay.io; se usa la imagen de Chainguard.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: eventos_minio
    user: root # el volumen nombrado es de root; la imagen corre como 65532 por defecto
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - '9000:9000' # API S3 (la usa el backend)
      - '9001:9001' # consola web: http://localhost:9001
    volumes:
      - minio_data:/data

  # Crea los buckets al levantar y termina. eventos-public es legible por URL; eventos-private no.
  minio-init:
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: miniopassword
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws --endpoint-url http://minio:9000 s3api list-buckets; do sleep 1; done
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket eventos-public || true
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket eventos-private || true
        aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket eventos-public --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::eventos-public/*"]}]}'

volumes:
  pg_data:
  minio_data:

